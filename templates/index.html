<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anime108 HLS Proxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    :root{--bg:#080b14;--panel:#111827cc;--line:#263246;--text:#f8fafc;--muted:#94a3b8;--cyan:#22d3ee;--violet:#a855f7;--red:#fb7185}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172554 0,transparent 35%),radial-gradient(circle at 90% 15%,#3b0764 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,Kanit,sans-serif;padding:24px}
    main{max-width:1000px;margin:auto;display:grid;gap:20px} header{display:flex;align-items:center;justify-content:space-between;padding:10px 2px} h1{font-size:24px;margin:0;background:linear-gradient(90deg,var(--cyan),#fff,var(--violet));color:transparent;background-clip:text} a{color:var(--cyan);text-decoration:none}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 16px 50px #0006}.row{display:flex;gap:10px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab,.btn{border:1px solid var(--line);border-radius:10px;background:#172033;color:var(--text);padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}.tab.active,.btn.primary{background:linear-gradient(135deg,#0891b2,#7c3aed);border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}input{width:100%;border:1px solid var(--line);background:#080d19;color:var(--text);border-radius:10px;padding:13px;font:inherit;outline:none}input:focus{border-color:var(--cyan)}
    .hidden{display:none!important}.message{margin-top:12px;color:var(--muted);font-size:14px}.message.error{color:var(--red)}#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px;max-height:340px;overflow:auto}.result{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b1220;cursor:pointer}.result:hover{border-color:var(--cyan)}.result img{width:54px;height:72px;object-fit:cover;border-radius:7px}.result strong{font-size:14px}.muted{color:var(--muted);font-size:12px;margin-top:6px}
    #showTitle{margin:0 0 15px;font-size:20px}.lang-tabs{display:flex;gap:8px;margin-bottom:12px}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:260px;overflow:auto}.episode{padding:10px;border:1px solid var(--line);border-radius:9px;background:#0b1220;color:var(--text);cursor:pointer}.episode:hover,.episode.selected{border-color:var(--cyan);background:#123047}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}.player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.live{font-size:12px;color:#34d399;border:1px solid #166534;padding:5px 9px;border-radius:99px}.notice{color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px}@media(max-width:620px){body{padding:12px}.row,.actions{flex-direction:column}.row .btn,.actions .btn{width:100%}header{align-items:flex-start}.panel{padding:16px}}
  </style>
</head>
<body>
<main>
  <header><h1>◉ Anime108 HLS Proxy</h1><a href="/docs" target="_blank">API Docs ↗</a></header>
  <section class="panel">
    <div class="tabs"><button class="tab active" data-mode="search">ค้นหาอนิเมะ</button><button class="tab" data-mode="url">ใส่ URL</button></div>
    <div id="searchMode"><div class="row"><input id="query" placeholder="ชื่อเรื่องหรือคำค้นหา"><button class="btn primary" id="searchBtn">ค้นหา</button></div><div id="results"></div></div>
    <div id="urlMode" class="hidden"><div class="row"><input id="directURL" placeholder="https://www.anime108.com/..."><button class="btn primary" id="loadBtn">โหลดตอน</button></div></div>
    <div id="message" class="message"></div>
  </section>
  <section class="panel hidden" id="showPanel">
    <h2 id="showTitle"></h2>
    <div class="lang-tabs"><button class="tab active" data-lang="Sound Track">ซับไทย</button><button class="tab" data-lang="Thai">พากย์ไทย</button></div>
    <div class="episodes" id="episodes"></div>
    <div class="actions"><span class="message" id="selection">กรุณาเลือกตอน</span><button class="btn primary" id="playBtn" disabled>▶ เล่นผ่าน HLS Proxy</button></div>
  </section>
  <section class="panel hidden" id="playerPanel">
    <div class="player-head"><strong id="playerTitle">กำลังเล่น</strong><span class="live">HLS PROXY</span></div>
    <video id="video" controls playsinline></video>
    <div class="notice">วิดีโอและ segment ถูกส่งผ่าน proxy แบบ streaming โดยไม่บันทึกไฟล์ลงเซิร์ฟเวอร์ ลิงก์ชั่วคราวจะหมดอายุอัตโนมัติ</div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let data=null,lang='Sound Track',selected=null,hls=null;
function message(text,error=false){$('message').textContent=text;$('message').className='message'+(error?' error':'')}
async function jsonFetch(path,options){const response=await fetch(path,options);const body=await response.json();if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);return body}
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('searchMode').classList.toggle('hidden',button.dataset.mode!=='search');$('urlMode').classList.toggle('hidden',button.dataset.mode!=='url');message('')});
$('searchBtn').onclick=async()=>{const q=$('query').value.trim();if(!q)return;message('กำลังค้นหา...');$('results').innerHTML='';try{const rows=await jsonFetch('/search?q='+encodeURIComponent(q));message(`พบ ${rows.length} รายการ`);rows.forEach(item=>{const card=document.createElement('div');card.className='result';const image=document.createElement('img');image.src=item.image||'';image.alt='';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=item.title||'';const episodes=document.createElement('div');episodes.className='muted';episodes.textContent=item.episodes_info||'ดูตอนทั้งหมด';info.append(title,episodes);card.append(image,info);card.onclick=()=>loadShow(item.url);$('results').appendChild(card)})}catch(error){message(error.message,true)}};
$('query').onkeydown=e=>{if(e.key==='Enter')$('searchBtn').click()};$('loadBtn').onclick=()=>loadShow($('directURL').value.trim());$('directURL').onkeydown=e=>{if(e.key==='Enter')$('loadBtn').click()};
async function loadShow(url){if(!url)return;message('กำลังโหลดข้อมูลตอน...');try{data=await jsonFetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});$('showTitle').textContent=data.title;$('showPanel').classList.remove('hidden');lang=(data.episodes['Sound Track']||[]).length?'Sound Track':'Thai';document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));renderEpisodes();message('โหลดข้อมูลสำเร็จ');$('showPanel').scrollIntoView({behavior:'smooth'})}catch(error){message(error.message,true)}}
document.querySelectorAll('[data-lang]').forEach(button=>button.onclick=()=>{lang=button.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===button));renderEpisodes()});
function renderEpisodes(){selected=null;$('playBtn').disabled=true;$('selection').textContent='กรุณาเลือกตอน';$('episodes').innerHTML='';const rows=data.episodes[lang]||[];if(!rows.length){$('episodes').innerHTML='<span class="message">ไม่มีตอนในภาษานี้</span>';return}rows.forEach(ep=>{const button=document.createElement('button');button.className='episode';button.textContent=ep.title;button.onclick=()=>{document.querySelectorAll('.episode').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');selected=ep;$('selection').textContent=`เลือก ${ep.title} · ${lang==='Thai'?'พากย์ไทย':'ซับไทย'}`;$('playBtn').disabled=false};$('episodes').appendChild(button)})}
$('playBtn').onclick=async()=>{if(!selected)return;const button=$('playBtn');button.disabled=true;button.textContent='กำลังเตรียม HLS...';try{const stream=await jsonFetch('/api/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:selected.url,lang})});playHLS(stream.playlist_url);$('playerTitle').textContent=`${stream.title} · EP ${stream.episode}`;$('playerPanel').classList.remove('hidden');$('playerPanel').scrollIntoView({behavior:'smooth'})}catch(error){message(error.message,true)}finally{button.disabled=false;button.textContent='▶ เล่นผ่าน HLS Proxy'}};
function playHLS(source){const video=$('video');if(hls){hls.destroy();hls=null}if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=source;video.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(source);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,info)=>{if(info.fatal)message('HLS playback error: '+info.details,true)})}else{message('เบราว์เซอร์นี้ไม่รองรับ HLS',true)}}
</script>
</body>
</html>
